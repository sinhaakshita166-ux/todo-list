<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Checklist</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>My Checklist</h1>

        <p class="subtitle">
            Organize your tasks and get things done!
        </p>

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Add a new task..."
            >

            <button
                id="addButton"
                type="button"
            >
                + Add
            </button>

        </div>

        <!-- Recurring task option -->
        <div class="recurring-section">

            <label class="recurring-label">

                <input
                    type="checkbox"
                    id="recurringCheckbox"
                >

                <span>Repeat this task</span>

            </label>

            <select
                id="recurrenceType"
                disabled
            >

                <option value="daily">
                    Every day
                </option>

                <option value="weekly">
                    Every week
                </option>

            </select>

        </div>

        <ul id="taskList"></ul>

        <p id="taskCount">
            0 tasks
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
